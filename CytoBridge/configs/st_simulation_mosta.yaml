model:
  components: ['velocity', 'growth', 'score', 'interaction']
  interaction_type: 'gnn'
  interaction_group_size: 1024
  velocity_net:
    hidden_dim: 256
    n_layers: 5
    residual: false
    activation: 'leaky_relu'
    use_spatial: true
  growth_net:
    hidden_dim: 256
    n_layers: 3
    residual: false
    activation: 'leaky_relu'
  score_net:
    hidden_dim: 400
    n_layers: 3
    activation: 'leaky_relu'
  interaction_net:
    hidden_dim: 256
    num_heads: 8
    num_layers: 1
    activation: 'leakyrelu'
    num_rbf: 8
    cutoff: 0.06
    use_spatial: true
    edge_predictor_path: 'edge_classifier/mouse.pt'
    edge_predictor_thre: 0.45

ckpt_dir: 'results/st_simulation_mosta'
reverse: true

training:
  defaults:
    lr: 0.0001
    lambda_ot: 10.0
    lambda_mass: 10.0
    lambda_energy: 0.01
    sigma: 0.03
    batch_size: 1024
    scheduler_step_size: 100
    scheduler_gamma: 0.8
    alpha_spatial: 1.0
    alpha_express: 1.0
    global_mass: true

  plan:
    - name: "Pretrain"
      mode: "neural_ode"
      epochs: 500
      batch_size: 1024
      OT_loss: 'weighted_emd_detach'
      train_strategy: "v+g"
      lambda_ot: 1.0
      lambda_mass: 0.01
      lambda_energy: 0.0

    - name: "Train_FM"
      mode: "flow_matching"
      epochs: 2001
      score_use: true
      batch_size: 512
      train_strategy: "s"
      scheduler_type: cosine
      flow_matching:
        lambda_penalty: 0

    - name: "Finetune"
      mode: "neural_ode"
      epochs: 1000
      OT_loss: 'weighted_emd'
      batch_size: 1024
      train_strategy: "v+g+i"
