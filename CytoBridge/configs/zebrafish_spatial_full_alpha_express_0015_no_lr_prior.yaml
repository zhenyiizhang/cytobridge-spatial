# Matched zebrafish reviewer ablation: preserve the complete trainable
# interaction GNN and spatial cutoff, but remove the pretrained LR-informed
# edge gate by exposing every within-cutoff spatial neighbor to message passing.
model:
  components: [velocity, growth, score, interaction]
  interaction_type: gnn
  interaction_group_size: 1024
  velocity_net:
    hidden_dim: 256
    n_layers: 5
    residual: false
    activation: leaky_relu
    use_spatial: true
  growth_net:
    hidden_dim: 256
    n_layers: 3
    residual: false
    activation: leaky_relu
  score_net:
    hidden_dim: 400
    n_layers: 3
    activation: leaky_relu
  interaction_net:
    hidden_dim: 256
    num_heads: 8
    num_layers: 1
    activation: leakyrelu
    num_rbf: 8
    cutoff: 0.09606367405591873
    use_spatial: true
    rbf_trainable: false
    edge_prior_mode: all_spatial

ckpt_dir: results/zebrafish_spatial_full_alpha_express_0015_no_lr_prior
reverse: true
seed: 42

training:
  defaults:
    lr: 0.0001
    lambda_ot: 10.0
    lambda_mass: 10.0
    lambda_energy: 0.01
    sigma: 0.03
    batch_size: 512
    alpha_spatial: 10.0
    alpha_express: 0.015
    global_mass: true

  plan:
    - name: Pretrain
      mode: neural_ode
      epochs: 100
      batch_size: 512
      OT_loss: weighted_emd_detach
      train_strategy: v+g
      lambda_ot: 1.0
      lambda_mass: 0.01
      lambda_energy: 0.0
      global_mass: false
      reverse_mass_norm: true
      reverse_mass_offset: false
      checkpoint_metric: legacy_forward_last_ot

    - name: Refine
      mode: neural_ode
      epochs: 100
      batch_size: 512
      OT_loss: weighted_emd
      train_strategy: v+g
      lambda_ot: 1.0
      lambda_mass: 0.01
      lambda_energy: 0.0
      global_mass: true
      reverse_mass_norm: true
      reverse_mass_offset: false
      checkpoint_metric: legacy_forward_last_ot

    - name: Init_interaction
      mode: neural_ode
      epochs: 50
      batch_size: 512
      OT_loss: weighted_emd
      train_strategy: v+g+i
      lambda_ot: 10.0
      lambda_mass: 10.0
      lambda_energy: 0.01
      global_mass: true
      reverse_mass_norm: false
      reverse_mass_offset: true
      checkpoint_metric: legacy_forward_last_ot

    - name: Train_Score
      mode: score_matching
      epochs: 2001
      batch_size: 128
      sigma: 0.03
      train_strategy: s
      optimizer_type: adamw
      lr: 0.0001
      lambda_penalty: 0
      save_strategy: last

    - name: Finetune
      mode: neural_ode
      epochs: 1000
      batch_size: 512
      OT_loss: weighted_emd
      train_strategy: v+g+i
      score_use: true
      lr: 0.0001
      lambda_ot: 10.0
      lambda_mass: 10.0
      lambda_energy: 0.01
      global_mass: true
      reverse_mass_norm: false
      reverse_mass_offset: true
      scheduler_type: plateau
      scheduler_metric: forward_last_ot
      scheduler_step_before_reverse: true
      max_grad_norm: 10.0
      checkpoint_metric: legacy_forward_last_ot
      save_strategy: best

    - name: Score_Refine
      mode: score_matching
      epochs: 2001
      batch_size: 128
      sigma: 0.03
      train_strategy: s
      optimizer_type: adamw
      lr: 0.0001
      lambda_penalty: 0
      save_strategy: last
