# Zebrafish Training Configuration
# Based on st_spatial.yaml but with reduced epochs for faster verification

model:
  components: ['velocity', 'growth', 'score', 'interaction']
  interaction_type: 'gnn'
  interaction_group_size: 1024
  velocity_net:
    hidden_dim: 256
    n_layers: 5
    residual: false
    activation: 'leaky_relu'
    use_spatial: true
  growth_net:
    hidden_dim: 256
    n_layers: 3
    residual: false
    activation: 'leaky_relu'
  score_net:
    hidden_dim: 400
    n_layers: 3
    activation: 'leaky_relu'
  interaction_net:
    hidden_dim: 256
    num_heads: 8
    num_layers: 1
    activation: 'leakyrelu'
    num_rbf: 4
    cutoff: 0.12
    use_spatial: true
    edge_predictor_path: '/lustre/home/2501111653/CytoBridge-ST-package/CytoBridge/edge_classifier/zebrafish.pt'
    edge_predictor_thre: 0.63

ckpt_dir: '/lustre/home/2501111653/CytoBridge-ST-package/results/zebrafish_training'
reverse: true
seed: 42

training:
  defaults:
    lr: 0.0001
    lambda_ot: 10.0
    lambda_mass: 10.0
    lambda_energy: 0.01
    sigma: 0.03
    batch_size: 512
    scheduler_step_size: 100
    scheduler_gamma: 0.8
    alpha_spatial: 10.0
    alpha_express: 0.05
    global_mass: true

  plan:
    - name: "Pretrain"
      mode: "neural_ode"
      epochs: 100
      batch_size: 512
      OT_loss: 'weighted_emd_detach'
      train_strategy: "v+g"
      lambda_ot: 1.0
      lambda_mass: 0.01
      lambda_energy: 0.0
      global_mass: false
      reverse_mass_norm: false
      reverse_mass_offset: true

    - name: "Refine"
      mode: "neural_ode"
      epochs: 100
      batch_size: 512
      OT_loss: 'weighted_emd'
      train_strategy: "v+g"
      lambda_ot: 1.0
      lambda_mass: 0.01
      lambda_energy: 0.0
      global_mass: true
      reverse_mass_norm: false
      reverse_mass_offset: true

    - name: "Init_interaction"
      mode: "neural_ode"
      epochs: 50
      batch_size: 512
      OT_loss: 'weighted_emd'
      train_strategy: "v+g+i"
      lambda_ot: 10.0
      lambda_mass: 10.0
      lambda_energy: 0.01
      global_mass: true
      reverse_mass_norm: false
      reverse_mass_offset: true

    - name: "Train_Score"
      mode: "score_matching"
      epochs: 500
      batch_size: 128
      sigma: 0.03
      train_strategy: "s"
      optimizer_type: adamw
      lambda_penalty: 0

    - name: "Finetune"
      mode: "neural_ode"
      epochs: 200
      batch_size: 512
      OT_loss: 'weighted_emd'
      train_strategy: "v+g+i"
      score_use: true
      lr: 0.00001
      scheduler_type: plateau
      global_mass: true
      reverse_mass_norm: false
      reverse_mass_offset: true

    - name: "Train_Score_Final"
      mode: "score_matching"
      epochs: 500
      batch_size: 128
      sigma: 0.03
      train_strategy: "s"
      optimizer_type: adamw
      lambda_penalty: 0
