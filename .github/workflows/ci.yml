name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[all]' pytest build twine
      - name: Test source package
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q
      - name: Smoke the four dataset notebook APIs
        env:
          NUMBA_DISABLE_JIT: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/smoke_dataset_notebooks.py
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Test an installed wheel without source imports
        run: python scripts/smoke_installed_wheel.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the Read the Docs dependency set
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install .
      - name: Build documentation with warnings as errors
        env:
          NUMBA_DISABLE_JIT: "1"
        run: sphinx-build -W --keep-going -E -b html docs docs/_build/html
